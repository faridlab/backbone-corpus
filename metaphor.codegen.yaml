# Codegen policy for corpus.
#
# `user_owned` globs are hand-written files that live inside generator-owned trees but are
# NOT schema-derived. `metaphor schema generate [--force]` skips them wholesale (never reads,
# merges, or deletes them). Everything else in src/ is regenerated from schema/models.
#
# Re-exports/declarations that must sit alongside generated code live inside
# `// <<< CUSTOM ... // END CUSTOM` markers (service/mod.rs, presentation/http/mod.rs, lib.rs)
# and are preserved by the marker mechanism, not listed here.
#
# Add your hand-authored services, handlers, tests, and docs below as you write them.

user_owned:
  - "src/application/service/corpus_write_service.rs"
  # Intentionally-empty workflows module shell. The example saga scaffold that
  # lived here was removed (no references outside this module); the generated
  # src/application/mod.rs still declares `pub mod workflows;`, so the empty
  # shell is declared hand-owned so regeneration never restores scaffolding here.
  - "src/application/workflows/mod.rs"
  # Own the hand-written corpus SQL (the category/article/feedback inserts, the article status
  # transitions, the idempotent link claim + re-read, the publish-gated deflection reads) that the write
  # service orchestrates. Declared here — not renamed with a `_custom` suffix — so the generator skips
  # them wholesale; this declaration is what makes editing them legitimate.
  - "src/infrastructure/persistence/article_category_repository.rs"
  - "src/infrastructure/persistence/article_repository.rs"
  - "src/infrastructure/persistence/article_link_repository.rs"
  - "src/infrastructure/persistence/article_feedback_repository.rs"
  # Hand-authored migrations (the guarded company-artifact strip — the strip's ordering
  # guard is hand-authored logic, not schema-derived emission).
  - "migrations/20260909112729_strip_tenancy.up.sql"
  - "migrations/20260909112729_strip_tenancy.down.sql"
  - "tests/features/**"
  - "tests/corpus_golden_cases.rs"
  - "tests/integrity_probes.rs"
  - "tests/corpus_support_seam.rs"
  - "tests/common/**"
  - "docs/**"